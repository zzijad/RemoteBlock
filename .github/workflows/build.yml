name: Build RemoteBlock APK

# Push na main: build + artefakt. Tag v*: build + GitHub Release sa APK-om.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Preimenuj APK
        run: cp app/build/outputs/apk/release/*.apk RemoteBlock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteBlock-apk
          path: RemoteBlock.apk
          retention-days: 7
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Remote Block ${{ github.ref_name }}
          files: RemoteBlock.apk
          generate_release_notes: true
